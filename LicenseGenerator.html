<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeeMyPickle License Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background-color: #f6f8fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(149, 157, 165, 0.2); width: 100%; max-width: 400px; }
        h1 { margin-top: 0; font-size: 24px; color: #24292f; border-bottom: 2px solid #2e7d32; padding-bottom: 10px; margin-bottom: 30px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #57606a; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; font-size: 16px; font-family: monospace; margin-bottom: 20px; transition: border-color 0.2s; }
        input:focus { border-color: #2e7d32; outline: none; box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1); }
        button { width: 100%; padding: 12px; background-color: #2e7d32; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #235e26; }
        .result-box { margin-top: 30px; padding: 20px; background-color: #f3f4f6; border-radius: 8px; display: none; text-align: center; }
        .result-label { font-size: 12px; color: #57606a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .key { font-size: 20px; font-weight: 900; color: #2e7d32; font-family: monospace; letter-spacing: 2px; cursor: pointer; }
        .key:hover { text-decoration: underline; }
        .copy-hint { font-size: 11px; color: #8c959f; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>SeeMyPickle Generator</h1>

        <label for="deviceId">Device ID (from App)</label>
        <input type="text" id="deviceId" placeholder="PB-XXXX-XXXX" maxlength="12">

        <button onclick="generate()">Generate Serial Key</button>

        <div id="result" class="result-box">
            <div class="result-label">Generated Key</div>
            <div id="keyDisplay" class="key" onclick="copyKey()">XXXX-XXXX-XXXX-XXXX</div>
            <div class="copy-hint">Click key to copy</div>
        </div>
    </div>

    <script>
        const LICENSE_SALT = "pbcam_premium_2026_secret";

        async function generate() {
            let deviceId = document.getElementById('deviceId').value.trim().toUpperCase();
            if (!deviceId || deviceId.length < 8) {
                alert("Please enter a valid Device ID (PB-XXXX-XXXX)");
                return;
            }

            // Strip PB prefix and dashes before hashing to match Android app logic
            deviceId = deviceId.replace(/^PB-/i, "").replace(/-/g, "");

            const input = deviceId + LICENSE_SALT;
            console.log("Hashing Input String:", input); // Hidden debug info

            const encoder = new TextEncoder();
            const data = encoder.encode(input);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hexHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();

            const rawKey = hexHash.substring(0, 16);
            const formattedKey = rawKey.match(/.{1,4}/g).join('-');

            document.getElementById('keyDisplay').innerText = formattedKey;
            document.getElementById('result').style.display = 'block';
        }

        function copyKey() {
            const key = document.getElementById('keyDisplay').innerText;
            navigator.clipboard.writeText(key).then(() => {
                alert("Key copied to clipboard!");
            });
        }
    </script>
</body>
</html>
